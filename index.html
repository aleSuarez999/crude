<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juguetería Cósmica</title>
    <link rel="stylesheet" href="./sass/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="./js/upload.js"></script>
</head>
<body>
    <header class="navbar__container">
        <div class="container d-flex space-between">
            <a href="./index.html"><h1>Juguetería Cósmica</h1></a>
        </div>
    </header>
    <div class="d-flex">
        <main class="container">
            <div class="grid">
                <div class=" col-xl-4 col-lg-5 col-xs-12 ">
                    <form class="form__container" onsubmit="uploadSubmit(event)">
                        <div class="form__input-group">
                            <label for="title" class="form__label" >Titulo</label>
                            <input class="form__input" type="text" name="title" id="title">
                            <span id="title-error" class="form__error"></span>
                        </div>
                        <div class="form__input-group">
                            <label for="year" class="form__label" >Año de estreno de la primera temporada</label>
                            <input class="form__input"  type="number"  name="year" id="year">
                            <span id="year-error" class="form__error"></span>
                        </div>
                        <div class="form__input-group">
                            <label for="sinopsis" class="form__label" >sinopsis</label>
                            <input class="form__input"  type="text"  name="sinopsis" id="sinopsis">
                            <span id="sinopsis-error" class="form__error"></span>
                        </div>
                        <div class="form__input-group">
                            <label for="gender" class="form__label" >gender</label>
                            <input class="form__input"  type="text"  name="gender" id="gender">
                            <span id="gender-error" class="form__error"></span>
                        </div>
                        <div class="form__input-group">
                            <label for="director" class="form__label" >director</label>
                            <input  class="form__input" type="text"  name="director" id="director">
                            <span id="director-error" class="form__error"></span>
                        </div>
                        <div class="form__input-group">
                            <label for="country" class="form__label" >country</label>
                            <input class="form__input"  type="text"  name="country" id="country">
                            <span id="country-error" class="form__error"></span>
                        </div>
                        <div class="form__input-group">
                            <label for="image" class="form__label" >image</label>
                            <input  class="form__input" type="text"  name="image" id="image">
                            <span id="image-error" class="form__error"></span>
                        </div>
                        <button type="submit" class="form__submit btn btn__primary">
                            <i class="fa-solid fa-paper-plane"></i>Guardar
                        </button>

                    </form>
                </div>
            </div>
        </main>
    </div>
    <footer class="footer__container">
        <div class="footer__wrapp container">
            <h4>Juguetería Cósmica</h4>
            <span>Copyright 2025 ©</span>
            <div class="d-flex">
                <a class="footer__socialmedia-links" href="https://www.facebook.com" target="_blank"><i class="fa-brands fa-facebook"></i></a>
                <a class="footer__socialmedia-links" href="https://www.instagram.com" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                <a class="footer__socialmedia-links" href="https://www.youtube.com" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>
    
    
</body>
</html>
